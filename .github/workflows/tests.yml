name: Verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: signal_test
          POSTGRES_USER: signal
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest test_server test_web
      - name: PostgreSQL et import SQLite
        env:
          TEST_POSTGRES_URL: postgresql://signal:test_only_password@localhost:5432/signal_test
        run: python -m unittest test_postgres
      - run: node --check public/app.js
