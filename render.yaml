services:
  - type: web
    name: signal-veille-ia
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py init && gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: ALLOW_PAID_AI
        value: 'false'
      - key: DATABASE_URL
        sync: false
      - key: APP_USERNAME
        value: louis
      - key: APP_PASSWORD
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini

